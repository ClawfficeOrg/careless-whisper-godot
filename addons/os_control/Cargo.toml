[package]
name = "careless_whisper_os"
version = "0.1.0"
edition = "2021"
description = "OS control GDExtension for careless-whisper — window management, accessibility, input injection"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = "0.4"

# Cross-platform window management
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
core-graphics = "0.24"

[target.'cfg(target_os = "linux")'.dependencies]
xcb = { version = "1.4", features = ["xkb", "randr", "ewmh"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
