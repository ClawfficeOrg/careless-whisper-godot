name: CI Windows — whisper_cpp DLL

on:
  push:
    branches: [main, "feature/**", "task-**"]
    paths:
      - ".github/workflows/ci-windows.yml"
      - "scripts/ci/build_whisper_windows.ps1"
      - "addons/whisper_cpp/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci-windows.yml"
      - "scripts/ci/build_whisper_windows.ps1"
      - "addons/whisper_cpp/**"
  workflow_dispatch:

# Minimal token permissions — no write access needed; artifacts are uploaded,
# binaries are never committed back to the repository.
permissions:
  contents: read

jobs:
  # ── Build whisper_cpp DLL on Windows (matrix over architectures) ─────────
  build-whisper-windows:
    name: Build whisper_cpp DLL (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            rust_target: x86_64-pc-windows-msvc
            dll_suffix: x86_64

    steps:
      - name: Checkout careless-whisper-godot
        uses: actions/checkout@v4

      # whisper.cpp lives in a sibling repository.  Use a repo-scoped PAT
      # (WHISPER_REPO_TOKEN secret) when the sibling repo is private; omit the
      # token field if it is public and the default GITHUB_TOKEN has read access.
      - name: Checkout whisper.cpp (godot-whisper-cpp-node branch)
        uses: actions/checkout@v4
        with:
          repository: ClawfficeOrg/whisper.cpp
          ref: godot-whisper-cpp-node
          path: whisper.cpp
          token: ${{ secrets.WHISPER_REPO_TOKEN || github.token }}

      - name: Install Rust toolchain (${{ matrix.rust_target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            whisper.cpp/godot-extension/target
          key: >-
            windows-${{ matrix.arch }}-cargo-whisper-${{
              hashFiles('whisper.cpp/godot-extension/Cargo.lock',
                        'whisper.cpp/godot-extension/Cargo.toml')
            }}
          restore-keys: |
            windows-${{ matrix.arch }}-cargo-whisper-

      - name: Install LLVM (required by bindgen / whisper-rs)
        run: choco install llvm --yes --no-progress
        shell: powershell

      - name: Set LIBCLANG_PATH
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          echo "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: powershell

      - name: Build whisper_cpp GDExtension (release)
        shell: powershell
        run: |
          & "${{ github.workspace }}\scripts\ci\build_whisper_windows.ps1" `
            -WhisperDir "${{ github.workspace }}\whisper.cpp\godot-extension" `
            -GodotProject "${{ github.workspace }}" `
            -Arch "${{ matrix.arch }}" `
            -RustTarget "${{ matrix.rust_target }}"

      - name: Verify DLL was produced
        shell: powershell
        run: |
          $dll = "addons\whisper_cpp\bin\whisper_cpp_gdext.windows.release.${{ matrix.dll_suffix }}.dll"
          if (-not (Test-Path $dll)) {
            Write-Error "Expected DLL not found: $dll"
            exit 1
          }
          $size = (Get-Item $dll).Length
          Write-Host "DLL produced: $dll ($size bytes)"

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper_cpp-windows-${{ matrix.arch }}
          path: addons/whisper_cpp/bin/whisper_cpp_gdext.windows.release.${{ matrix.dll_suffix }}.dll
          if-no-files-found: error
          retention-days: 14

  # ── GDScript lint (Ubuntu — avoids Windows shell issues with lint.sh) ────
  gdscript-lint:
    name: GDScript lint (strict)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.3 headless
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"

      - name: Create Godot symlink for lint script
        run: |
          ln -s /tmp/godot/Godot_v4.3-stable_linux.x86_64 /tmp/godot/godot

      - name: Run lint (strict)
        run: ./scripts/lint.sh --strict
